name: cache-refresh

# Locked 2026-06-22 (Milan: "cache should never be able to expire" +
# "we maximize caching as much as we can and at all times.").
#
# Strategy: list every Gemini context cache and push its TTL forward 24h on
# every fire. Cadence = every 30 min. Combined with the 24h max TTL, the
# absolute floor is 23.5h remaining at all times — 47× safety margin vs
# the 30-min refresh cadence.

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min, no jitter
  workflow_dispatch: {}

concurrency:
  group: cache-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Extend TTL on every live Gemini cache
        env:
          # google-genai SDK accepts either env name. We keep both wired so
          # rotating one doesn't require a workflow edit.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHARON_CRITICAL_ALERT_WEBHOOK: ${{ secrets.SHARON_CRITICAL_ALERT_WEBHOOK }}
          PRIORITY_BRIEF_WEBHOOK_URL: ${{ secrets.PRIORITY_BRIEF_WEBHOOK_URL }}
        run: python scripts/cache_refresh_watcher.py
